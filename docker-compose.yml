# ─────────────────────────────────────────────────────────────────
# Open-Soulmate 全栈 Docker Compose
# Usage: docker compose up -d
# ─────────────────────────────────────────────────────────────────

services:
  # ── 基础设施 ──────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensoul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensoul}
      POSTGRES_DB: ${POSTGRES_DB:-opensoul}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opensoul}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opensoul-net

  qdrant:
    image: qdrant/qdrant:v1.12.1
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opensoul-net

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-opensoul_master_key}
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opensoul-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opensoul-net

  # ── 应用服务 ──────────────────────────────────────────────

  # OpenSoul — 大脑（中央记忆内核）
  opensoul:
    build:
      context: ../opensoul
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SOUL_PORT:-8090}:8000"
    env_file:
      - ../opensoul/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-opensoul}:${POSTGRES_PASSWORD:-opensoul}@postgres:5432/${POSTGRES_DB:-opensoul}
      QDRANT_URL: http://qdrant:6333
      MEILI_URL: http://meilisearch:7700
      MEILI_KEY: ${MEILI_MASTER_KEY:-opensoul_master_key}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - soul_data:/app/data
    networks:
      - opensoul-net

  # OpenMate — 共生伙伴（Web前端）
  openmate:
    build:
      context: ../openmate
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MATE_PORT:-3002}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://opensoul:8000
      SOUL_API_URL: http://opensoul:8000
    depends_on:
      opensoul:
        condition: service_started
    networks:
      - opensoul-net

  # ── 可选：OpenSoma 躯体分身 ────────────────────────────────
  # Uncomment to enable distributed collection agent
  # opensoma:
  #   build:
  #     context: ../opensoma
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   environment:
  #     SOMA_SOUL_URL: http://opensoul:8000
  #   depends_on:
  #     opensoul:
  #       condition: service_started
  #   volumes:
  #     - soma_data:/app/data
  #   networks:
  #     - opensoul-net

networks:
  opensoul-net:
    driver: bridge

volumes:
  pgdata:
  qdrant_data:
  meili_data:
  redis_data:
  soul_data:
  # soma_data:
