<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSoul — 管理中心</title>
  <link rel="stylesheet" href="/admin/shared.css">
  <style>
    /* Page-specific overrides */
    .content { padding: 24px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar - same as OpenMate -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo">OS</span>
        <span style="margin-left:8px;font-size:14px;font-weight:600;">OpenSoul</span>
        <span class="version" style="margin-left:auto">v0.1.0</span>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-title">概览</div>
          <a class="nav-item active" href="/admin/marketplace.html" data-page="marketplace">
            <span class="icon">🏪</span><span>技能市场</span>
          </a>
          <a class="nav-item" href="/admin/" data-page="dashboard">
            <span class="icon">📊</span><span>仪表盘</span>
          </a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-title">管理</div>
          <a class="nav-item" href="/admin/marketplace.html#skills" data-page="skills">
            <span class="icon">📦</span><span>技能源</span>
          </a>
          <a class="nav-item" href="/admin/marketplace.html#agents" data-page="agents">
            <span class="icon">🤖</span><span>Agent源</span>
          </a>
          <a class="nav-item" href="/admin/marketplace.html#sync" data-page="sync">
            <span class="icon">🔄</span><span>同步状态</span>
          </a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-title">系统</div>
          <a class="nav-item" href="/docs" target="_blank">
            <span class="icon">📖</span><span>API文档</span>
          </a>
          <a class="nav-item" href="/" target="_blank">
            <span class="icon">🌐</span><span>OpenSoul</span>
          </a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user">
          <div class="avatar">A</div>
          <div class="user-info">
            <div class="user-name">Admin</div>
            <div class="user-role">管理员</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <div class="topbar">
        <div class="topbar-title" id="pageTitle">🏪 技能市场管理</div>
        <div class="topbar-actions">
          <button class="btn btn-primary" onclick="showAddForm()">+ 添加源</button>
        </div>
      </div>

      <div class="content" id="content">
        <!-- Breadcrumb -->
        <div class="breadcrumb">
          <a href="/admin/">OpenSoul</a>
          <span class="sep">›</span>
          <span id="breadcrumbPage">技能市场管理</span>
        </div>

        <!-- Mode Toggle -->
        <div class="mode-toggle">
          <div class="mode-info">
            <div class="mode-label">🌐 同步模式</div>
            <div class="mode-desc">内网部署时，OpenSoul从外部源同步技能/Agent，OpenMate从OpenSoul获取。联网时OpenMate可直连外部源。</div>
          </div>
          <div class="toggle on" id="syncMode" onclick="toggleSyncMode()"></div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="stats"></div>

        <!-- Tabs -->
        <div class="tabs">
          <div class="tab active" data-tab="skills" onclick="switchTab('skills')">📦 技能源</div>
          <div class="tab" data-tab="agents" onclick="switchTab('agents')">🤖 Agent源</div>
          <div class="tab" data-tab="sync" onclick="switchTab('sync')">🔄 同步状态</div>
        </div>

        <!-- Add Form -->
        <div class="form-card" id="addForm">
          <div class="form-row">
            <div class="form-group">
              <label>名称</label>
              <input id="formName" placeholder="如：我的技能仓库">
            </div>
            <div class="form-group">
              <label>类型</label>
              <select id="formType">
                <option value="github">GitHub</option>
                <option value="hermes">Hermes</option>
                <option value="openclaw">OpenClaw</option>
                <option value="tencent">腾讯</option>
                <option value="aliyun">阿里云</option>
                <option value="custom">自定义</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>URL</label>
              <input id="formUrl" placeholder="https://github.com/org/repo">
            </div>
            <div class="form-group">
              <label>同步间隔（秒）</label>
              <input id="formInterval" type="number" value="3600">
            </div>
          </div>
          <div class="form-group">
            <label>描述</label>
            <input id="formDesc" placeholder="简短描述这个源...">
          </div>
          <div class="form-actions">
            <button class="btn btn-outline" onclick="hideAddForm()">取消</button>
            <button class="btn btn-primary" onclick="addSource()">添加</button>
          </div>
        </div>

        <!-- Content Lists -->
        <div id="skillsList" class="section"></div>
        <div id="agentsList" class="section" style="display:none"></div>
        <div id="syncList" class="section" style="display:none"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = window.location.origin;
    let token = localStorage.getItem('opensoul-token') || '';
    let currentTab = 'skills';

    async function ensureAuth() {
      if (token) return;
      try {
        const res = await fetch(`${API}/api/user/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'username=admin&password=admin123'
        });
        const data = await res.json();
        if (data.access_token) {
          token = data.access_token;
          localStorage.setItem('opensoul-token', token);
        }
      } catch (e) { console.error('Auth failed:', e); }
    }

    async function apiFetch(path, opts = {}) {
      await ensureAuth();
      const res = await fetch(`${API}${path}`, {
        ...opts,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...opts.headers },
      });
      return res.json();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2000);
    }

    // ─── Load Data ────────────────────────────────────────────

    async function loadStats() {
      const data = await apiFetch('/api/marketplace/stats');
      document.getElementById('stats').innerHTML = `
        <div class="stat-card primary"><div class="number">${data.skill_sources || 0}</div><div class="label">技能源</div></div>
        <div class="stat-card green"><div class="number">${data.agent_sources || 0}</div><div class="label">Agent源</div></div>
        <div class="stat-card amber"><div class="number">${data.total_skills || 0}</div><div class="label">可用技能</div></div>
        <div class="stat-card gray"><div class="number">${data.total_agents || 0}</div><div class="label">可用Agent</div></div>
      `;
    }

    function renderSourceCard(s, type) {
      return `
        <div class="card">
          <div class="card-header">
            <div class="card-left">
              <div class="card-icon ${type === 'agent' ? 'green' : 'primary'}">${type === 'agent' ? '🤖' : '📦'}</div>
              <div style="min-width:0;flex:1">
                <div class="card-title">${s.name}</div>
                <div class="card-desc">${s.description}</div>
                <div class="card-meta">${s.url} · ${s.skill_count || s.agent_count || 0} ${type} · 同步间隔 ${s.sync_interval || '-'}s</div>
              </div>
            </div>
            <div class="card-actions">
              <span class="badge ${s.enabled ? 'enabled' : 'disabled'}">${s.enabled ? '已启用' : '已禁用'}</span>
              <span class="badge ${s.builtin ? 'builtin' : 'custom'}">${s.builtin ? '内置' : '自定义'}</span>
              <div class="toggle ${s.enabled ? 'on' : 'off'}" onclick="toggleSource('${type}s','${s.id}',${!s.enabled})"></div>
              <button class="btn btn-outline btn-sm" onclick="syncSource('${type}s','${s.id}')">🔄 同步</button>
              ${!s.builtin ? `<button class="btn btn-danger btn-sm" onclick="deleteSource('${type}s','${s.id}')">删除</button>` : ''}
            </div>
          </div>
        </div>`;
    }

    async function loadSkillSources() {
      const data = await apiFetch('/api/marketplace/skills/sources');
      const el = document.getElementById('skillsList');
      if (!data.sources?.length) { el.innerHTML = '<div class="empty"><div class="icon">📦</div><p>暂无技能源</p></div>'; return; }
      el.innerHTML = `<div class="section-title">📦 技能源配置</div>${data.sources.map(s => renderSourceCard(s, 'skill')).join('')}`;
    }

    async function loadAgentSources() {
      const data = await apiFetch('/api/marketplace/agents/sources');
      const el = document.getElementById('agentsList');
      if (!data.sources?.length) { el.innerHTML = '<div class="empty"><div class="icon">🤖</div><p>暂无Agent源</p></div>'; return; }
      el.innerHTML = `<div class="section-title">🤖 Agent源配置</div>${data.sources.map(s => renderSourceCard(s, 'agent')).join('')}`;
    }

    async function loadSyncStatus() {
      const skills = await apiFetch('/api/marketplace/skills/sources');
      const agents = await apiFetch('/api/marketplace/agents/sources');
      const el = document.getElementById('syncList');
      const all = [...(skills.sources||[]), ...(agents.sources||[])].filter(s => s.enabled);
      if (!all.length) { el.innerHTML = '<div class="empty"><div class="icon">🔄</div><p>暂无启用的源</p></div>'; return; }
      el.innerHTML = `<div class="section-title">🔄 同步状态</div>${all.map(s => `
        <div class="card">
          <div class="card-header">
            <div class="card-left">
              <div class="card-icon ${s.agent_count !== undefined ? 'green' : 'primary'}">${s.agent_count !== undefined ? '🤖' : '📦'}</div>
              <div>
                <div class="card-title">${s.name}</div>
                <div class="card-meta">上次同步: ${s.last_sync || '从未同步'} · ${s.auto_sync || s.auto_update ? '✅ 自动同步' : '⏸ 手动同步'}</div>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn btn-primary btn-sm" onclick="syncSource('${s.agent_count !== undefined ? 'agents' : 'skills'}','${s.id}')">🔄 立即同步</button>
            </div>
          </div>
        </div>`).join('')}`;
    }

    // ─── Actions ──────────────────────────────────────────────

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('skillsList').style.display = tab === 'skills' ? 'block' : 'none';
      document.getElementById('agentsList').style.display = tab === 'agents' ? 'block' : 'none';
      document.getElementById('syncList').style.display = tab === 'sync' ? 'block' : 'none';
      // Update sidebar active state
      document.querySelectorAll('.nav-item[data-page]').forEach(n => {
        n.classList.toggle('active', n.dataset.page === tab || (tab === 'skills' && n.dataset.page === 'marketplace'));
      });
      load();
    }

    async function toggleSource(type, id, enabled) {
      await apiFetch(`/api/marketplace/${type}/sources/${id}`, { method: 'PUT', body: JSON.stringify({ enabled }) });
      showToast(enabled ? '已启用' : '已禁用');
      load();
    }

    async function syncSource(type, id) {
      await apiFetch(`/api/marketplace/${type}/sources/${id}/sync`, { method: 'POST' });
      showToast('同步完成');
      load();
    }

    async function deleteSource(type, id) {
      if (!confirm('确定删除这个源？')) return;
      await apiFetch(`/api/marketplace/${type}/sources/${id}`, { method: 'DELETE' });
      showToast('已删除');
      load();
    }

    function showAddForm() { document.getElementById('addForm').classList.add('show'); }
    function hideAddForm() { document.getElementById('addForm').classList.remove('show'); }

    async function addSource() {
      const name = document.getElementById('formName').value;
      const type = document.getElementById('formType').value;
      const url = document.getElementById('formUrl').value;
      const desc = document.getElementById('formDesc').value;
      const interval = parseInt(document.getElementById('formInterval').value) || 3600;
      if (!name || !url) { alert('请填写名称和URL'); return; }
      const suffix = currentTab === 'skills' ? 'skills' : 'agents';
      await apiFetch(`/api/marketplace/${suffix}/sources`, {
        method: 'POST',
        body: JSON.stringify({ name, type, url, description: desc, enabled: true, auto_sync: true, sync_interval: interval }),
      });
      hideAddForm();
      showToast('添加成功');
      document.getElementById('formName').value = '';
      document.getElementById('formUrl').value = '';
      document.getElementById('formDesc').value = '';
      load();
    }

    function toggleSyncMode() {
      const el = document.getElementById('syncMode');
      el.classList.toggle('on');
      el.classList.toggle('off');
    }

    // Handle URL hash for tab navigation
    function handleHash() {
      const hash = window.location.hash.replace('#', '');
      if (['skills', 'agents', 'sync'].includes(hash)) switchTab(hash);
    }
    window.addEventListener('hashchange', handleHash);

    async function load() {
      await loadStats();
      if (currentTab === 'skills') await loadSkillSources();
      else if (currentTab === 'agents') await loadAgentSources();
      else await loadSyncStatus();
    }

    (async () => { await ensureAuth(); handleHash(); await load(); })();
  </script>
</body>
</html>
