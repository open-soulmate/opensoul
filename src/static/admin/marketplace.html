<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSoul - 技能市场管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e4e4e7; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .header h1 { font-size: 24px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .header h1 span { color: #6366f1; }
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; background: #18181b; border-radius: 8px; padding: 4px; width: fit-content; }
    .tab { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #71717a; transition: all 0.2s; }
    .tab.active { background: #27272a; color: #fff; }
    .tab:hover:not(.active) { color: #a1a1aa; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 16px; }
    .stat .number { font-size: 28px; font-weight: 700; }
    .stat .label { font-size: 13px; color: #71717a; margin-top: 4px; }
    .stat.primary .number { color: #6366f1; }
    .stat.green .number { color: #22c55e; }
    .stat.amber .number { color: #f59e0b; }
    .stat.gray .number { color: #71717a; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .card-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
    .card-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .card-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 20px; }
    .card-icon.skill { background: rgba(99,102,241,0.15); }
    .card-icon.agent { background: rgba(34,197,94,0.15); }
    .card-title { font-size: 14px; font-weight: 500; }
    .card-desc { font-size: 12px; color: #71717a; margin-top: 2px; }
    .card-meta { font-size: 11px; color: #52525b; margin-top: 4px; }
    .card-actions { display: flex; gap: 8px; align-items: center; }
    .badge { padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 500; }
    .badge.enabled { background: rgba(34,197,94,0.15); color: #22c55e; }
    .badge.disabled { background: rgba(113,113,122,0.15); color: #71717a; }
    .badge.builtin { background: rgba(99,102,241,0.15); color: #6366f1; }
    .badge.custom { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .btn { padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-outline { border-color: #3f3f46; color: #a1a1aa; background: transparent; }
    .btn-outline:hover { border-color: #52525b; color: #fff; }
    .btn-danger { border-color: rgba(239,68,68,0.3); color: #ef4444; background: transparent; }
    .btn-danger:hover { background: rgba(239,68,68,0.1); }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    .toggle { position: relative; width: 36px; height: 20px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    .toggle.on { background: #6366f1; }
    .toggle.off { background: #3f3f46; }
    .toggle::after { content: ''; position: absolute; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: 0.2s; }
    .toggle.on::after { left: 18px; }
    .toggle.off::after { left: 2px; }
    .section { margin-bottom: 24px; }
    .section-title { font-size: 13px; font-weight: 600; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .add-form { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; margin-bottom: 16px; display: none; }
    .add-form.show { display: block; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 12px; color: #a1a1aa; }
    .form-group input, .form-group select { padding: 8px 12px; border-radius: 6px; border: 1px solid #3f3f46; background: #09090b; color: #e4e4e7; font-size: 13px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: #6366f1; }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    .mode-toggle { display: flex; align-items: center; gap: 12px; background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 16px; margin-bottom: 24px; }
    .mode-label { font-size: 14px; font-weight: 500; }
    .mode-desc { font-size: 12px; color: #71717a; margin-top: 2px; }
    .mode-info { flex: 1; }
    .empty { text-align: center; padding: 40px; color: #52525b; }
    .success-toast { position: fixed; bottom: 24px; right: 24px; background: #22c55e; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; z-index: 100; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏪 <span>OpenSoul</span> 技能市场管理</h1>
      <button class="btn btn-primary" onclick="showAddForm()">+ 添加源</button>
    </div>

    <!-- Mode Toggle -->
    <div class="mode-toggle">
      <div class="mode-info">
        <div class="mode-label">🌐 同步模式</div>
        <div class="mode-desc">内网部署时，OpenSoul从外部源同步技能/Agent，OpenMate从OpenSoul获取。联网时OpenMate可直连外部源。</div>
      </div>
      <div class="toggle on" id="syncMode" onclick="toggleSyncMode()"></div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('skills')">📦 技能源</div>
      <div class="tab" onclick="switchTab('agents')">🤖 Agent源</div>
      <div class="tab" onclick="switchTab('sync')">🔄 同步状态</div>
    </div>

    <!-- Add Form -->
    <div class="add-form" id="addForm">
      <div class="form-row">
        <div class="form-group">
          <label>名称</label>
          <input id="formName" placeholder="如：我的技能仓库">
        </div>
        <div class="form-group">
          <label>类型</label>
          <select id="formType">
            <option value="github">GitHub</option>
            <option value="hermes">Hermes</option>
            <option value="openclaw">OpenClaw</option>
            <option value="tencent">腾讯</option>
            <option value="aliyun">阿里云</option>
            <option value="custom">自定义</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>URL</label>
          <input id="formUrl" placeholder="https://github.com/org/repo">
        </div>
        <div class="form-group">
          <label>同步间隔（秒）</label>
          <input id="formInterval" type="number" value="3600">
        </div>
      </div>
      <div class="form-group">
        <label>描述</label>
        <input id="formDesc" placeholder="简短描述这个源...">
      </div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="hideAddForm()">取消</button>
        <button class="btn btn-primary" onclick="addSource()">添加</button>
      </div>
    </div>

    <!-- Content -->
    <div id="skillsList" class="section"></div>
    <div id="agentsList" class="section" style="display:none"></div>
    <div id="syncList" class="section" style="display:none"></div>
  </div>

  <div class="success-toast" id="toast"></div>

  <script>
    const API = window.location.origin;
    let token = localStorage.getItem('opensoul-token') || '';
    let currentTab = 'skills';

    // Auto-login
    async function ensureAuth() {
      if (token) return;
      try {
        const res = await fetch(`${API}/api/user/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'username=admin&password=admin123'
        });
        const data = await res.json();
        if (data.access_token) {
          token = data.access_token;
          localStorage.setItem('opensoul-token', token);
        }
      } catch (e) { console.error('Auth failed:', e); }
    }

    async function apiFetch(path, opts = {}) {
      await ensureAuth();
      const res = await fetch(`${API}${path}`, {
        ...opts,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...opts.headers },
      });
      return res.json();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2000);
    }

    // ─── Load Data ────────────────────────────────────────────

    async function loadStats() {
      const data = await apiFetch('/api/marketplace/stats');
      document.getElementById('stats').innerHTML = `
        <div class="stat primary"><div class="number">${data.skill_sources || 0}</div><div class="label">技能源</div></div>
        <div class="stat green"><div class="number">${data.agent_sources || 0}</div><div class="label">Agent源</div></div>
        <div class="stat amber"><div class="number">${data.total_skills || 0}</div><div class="label">可用技能</div></div>
        <div class="stat gray"><div class="number">${data.total_agents || 0}</div><div class="label">可用Agent</div></div>
      `;
    }

    async function loadSkillSources() {
      const data = await apiFetch('/api/marketplace/skills/sources');
      const container = document.getElementById('skillsList');
      if (!data.sources?.length) {
        container.innerHTML = '<div class="empty">暂无技能源</div>';
        return;
      }
      container.innerHTML = `
        <div class="section-title">📦 技能源配置</div>
        ${data.sources.map(s => `
          <div class="card">
            <div class="card-header">
              <div class="card-left">
                <div class="card-icon skill">📦</div>
                <div>
                  <div class="card-title">${s.name}</div>
                  <div class="card-desc">${s.description}</div>
                  <div class="card-meta">${s.url} · ${s.skill_count} 技能 · 同步间隔 ${s.sync_interval}s</div>
                </div>
              </div>
              <div class="card-actions">
                <span class="badge ${s.enabled ? 'enabled' : 'disabled'}">${s.enabled ? '已启用' : '已禁用'}</span>
                <span class="badge ${s.builtin ? 'builtin' : 'custom'}">${s.builtin ? '内置' : '自定义'}</span>
                <div class="toggle ${s.enabled ? 'on' : 'off'}" onclick="toggleSource('skills','${s.id}',${!s.enabled})"></div>
                <button class="btn btn-outline btn-sm" onclick="syncSource('skills','${s.id}')">🔄 同步</button>
                ${!s.builtin ? `<button class="btn btn-danger btn-sm" onclick="deleteSource('skills','${s.id}')">删除</button>` : ''}
              </div>
            </div>
          </div>
        `).join('')}
      `;
    }

    async function loadAgentSources() {
      const data = await apiFetch('/api/marketplace/agents/sources');
      const container = document.getElementById('agentsList');
      if (!data.sources?.length) {
        container.innerHTML = '<div class="empty">暂无Agent源</div>';
        return;
      }
      container.innerHTML = `
        <div class="section-title">🤖 Agent源配置</div>
        ${data.sources.map(s => `
          <div class="card">
            <div class="card-header">
              <div class="card-left">
                <div class="card-icon agent">🤖</div>
                <div>
                  <div class="card-title">${s.name}</div>
                  <div class="card-desc">${s.description}</div>
                  <div class="card-meta">${s.url} · ${s.agent_count} Agent</div>
                </div>
              </div>
              <div class="card-actions">
                <span class="badge ${s.enabled ? 'enabled' : 'disabled'}">${s.enabled ? '已启用' : '已禁用'}</span>
                <span class="badge ${s.builtin ? 'builtin' : 'custom'}">${s.builtin ? '内置' : '自定义'}</span>
                <div class="toggle ${s.enabled ? 'on' : 'off'}" onclick="toggleSource('agents','${s.id}',${!s.enabled})"></div>
                ${!s.builtin ? `<button class="btn btn-danger btn-sm" onclick="deleteSource('agents','${s.id}')">删除</button>` : ''}
              </div>
            </div>
          </div>
        `).join('')}
      `;
    }

    async function loadSyncStatus() {
      const skills = await apiFetch('/api/marketplace/skills/sources');
      const agents = await apiFetch('/api/marketplace/agents/sources');
      const container = document.getElementById('syncList');
      const allSources = [...(skills.sources || []), ...(agents.sources || [])].filter(s => s.enabled);
      container.innerHTML = `
        <div class="section-title">🔄 同步状态</div>
        ${allSources.length === 0 ? '<div class="empty">暂无启用的源</div>' : allSources.map(s => `
          <div class="card">
            <div class="card-header">
              <div class="card-left">
                <div class="card-icon ${s.agent_count !== undefined ? 'agent' : 'skill'}">${s.agent_count !== undefined ? '🤖' : '📦'}</div>
                <div>
                  <div class="card-title">${s.name}</div>
                  <div class="card-meta">上次同步: ${s.last_sync || '从未同步'} · ${s.auto_sync || s.auto_update ? '✅ 自动同步' : '⏸ 手动同步'}</div>
                </div>
              </div>
              <div class="card-actions">
                <button class="btn btn-primary btn-sm" onclick="syncSource('${s.agent_count !== undefined ? 'agents' : 'skills'}','${s.id}')">🔄 立即同步</button>
              </div>
            </div>
          </div>
        `).join('')}
      `;
    }

    // ─── Actions ──────────────────────────────────────────────

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', ['skills', 'agents', 'sync'][i] === tab);
      });
      document.getElementById('skillsList').style.display = tab === 'skills' ? 'block' : 'none';
      document.getElementById('agentsList').style.display = tab === 'agents' ? 'block' : 'none';
      document.getElementById('syncList').style.display = tab === 'sync' ? 'block' : 'none';
      load();
    }

    async function toggleSource(type, id, enabled) {
      await apiFetch(`/api/marketplace/${type}/sources/${id}`, {
        method: 'PUT',
        body: JSON.stringify({ enabled }),
      });
      showToast(enabled ? '已启用' : '已禁用');
      load();
    }

    async function syncSource(type, id) {
      const suffix = type === 'skills' ? 'skills' : 'agents';
      await apiFetch(`/api/marketplace/${suffix}/sources/${id}/sync`, { method: 'POST' });
      showToast('同步完成');
      load();
    }

    async function deleteSource(type, id) {
      if (!confirm('确定删除这个源？')) return;
      const suffix = type === 'skills' ? 'skills' : 'agents';
      await apiFetch(`/api/marketplace/${suffix}/sources/${id}`, { method: 'DELETE' });
      showToast('已删除');
      load();
    }

    function showAddForm() { document.getElementById('addForm').classList.add('show'); }
    function hideAddForm() { document.getElementById('addForm').classList.remove('show'); }

    async function addSource() {
      const name = document.getElementById('formName').value;
      const type = document.getElementById('formType').value;
      const url = document.getElementById('formUrl').value;
      const desc = document.getElementById('formDesc').value;
      const interval = parseInt(document.getElementById('formInterval').value) || 3600;
      if (!name || !url) { alert('请填写名称和URL'); return; }

      const suffix = currentTab === 'skills' ? 'skills' : 'agents';
      await apiFetch(`/api/marketplace/${suffix}/sources`, {
        method: 'POST',
        body: JSON.stringify({ name, type, url, description: desc, enabled: true, auto_sync: true, sync_interval: interval }),
      });
      hideAddForm();
      showToast('添加成功');
      document.getElementById('formName').value = '';
      document.getElementById('formUrl').value = '';
      document.getElementById('formDesc').value = '';
      load();
    }

    function toggleSyncMode() {
      const el = document.getElementById('syncMode');
      el.classList.toggle('on');
      el.classList.toggle('off');
    }

    // ─── Init ─────────────────────────────────────────────────

    async function load() {
      await loadStats();
      if (currentTab === 'skills') await loadSkillSources();
      else if (currentTab === 'agents') await loadAgentSources();
      else await loadSyncStatus();
    }

    (async () => { await ensureAuth(); await load(); })();
  </script>
</body>
</html>
