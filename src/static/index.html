<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSoul</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="sidebar-expanded">
    <!-- Mobile overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar expanded" id="sidebar">
        <!-- Toggle button (desktop collapse/expand) -->
        <button class="sidebar-toggle" id="sidebar-toggle" title="折叠/展开侧边栏">◀</button>

        <!-- Header: Logo + Name + Version -->
        <div class="sidebar-header">
            <div class="logo-icon-wrap">OS</div>
            <div class="logo-text-group">
                <span class="logo-name">OpenSoul</span>
                <span class="logo-version" id="sidebar-version">v0.1.0</span>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="nav-menu">
            <a href="#dashboard" class="nav-item active" data-page="dashboard">
                <span class="nav-icon-wrap">⊞</span>
                <span class="nav-label">仪表盘</span>
            </a>
            <a href="#knowledge" class="nav-item" data-page="knowledge">
                <span class="nav-icon-wrap">◈</span>
                <span class="nav-label">知识库</span>
            </a>
            <a href="#graph" class="nav-item" data-page="graph">
                <span class="nav-icon-wrap">◇</span>
                <span class="nav-label">图谱</span>
            </a>
            <a href="#search" class="nav-item" data-page="search">
                <span class="nav-icon-wrap">⌕</span>
                <span class="nav-label">搜索</span>
            </a>
            <a href="#agents" class="nav-item" data-page="agents">
                <span class="nav-icon-wrap">◎</span>
                <span class="nav-label">Agent节点</span>
            </a>
            <a href="#marketplace" class="nav-item" data-page="marketplace">
                <span class="nav-icon-wrap">🏪</span>
                <span class="nav-label">技能源</span>
            </a>
            <a href="#agent-sources" class="nav-item" data-page="agent-sources">
                <span class="nav-icon-wrap">📦</span>
                <span class="nav-label">Agent源</span>
            </a>
            <a href="#settings" class="nav-item" data-page="settings">
                <span class="nav-icon-wrap">⚙</span>
                <span class="nav-label">系统设置</span>
            </a>
            <a href="#llm" class="nav-item" data-page="llm">
                <span class="nav-icon-wrap">✦</span>
                <span class="nav-label">LLM配置</span>
            </a>
        </nav>

        <!-- Footer: User info -->
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="user-avatar">A</div>
                <div class="user-info">
                    <span class="user-name">Admin</span>
                    <span class="user-role" id="sidebar-status-text">Soul 状态</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle" id="menu-toggle">☰</button>
                <span class="breadcrumb">OpenSoul</span>
                <span class="breadcrumb-sep">/</span>
                <h1 class="page-title" id="page-title">仪表盘</h1>
            </div>
            <div class="top-bar-right">
                <div class="status-badge">
                    <span class="status-label">版本</span>
                    <span class="status-value" id="header-version">-</span>
                </div>
                <div class="status-badge">
                    <span class="status-label">运行时间</span>
                    <span class="status-value" id="uptime">-</span>
                </div>
                <div class="status-badge">
                    <span class="status-label">状态</span>
                    <span class="status-value status-ok" id="header-status">-</span>
                </div>
            </div>
        </header>

        <!-- Page Content Area -->
        <div class="page-content" id="page-content">
            <!-- Dynamic content loaded here -->
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
