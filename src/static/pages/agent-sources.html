<div class="content-area">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
    <div>
      <h2 style="font-size:20px;font-weight:600;">Agent源管理</h2>
      <p style="font-size:13px;color:var(--muted-fg);margin-top:4px;">管理Agent注册源，从外部源同步Agent定义，OpenMate自动获取更新</p>
    </div>
    <button class="btn btn-primary" onclick="addAgentSource()">+ 添加Agent源</button>
  </div>

  <div id="agent-sources-list" class="card-grid"></div>
</div>

<script>
async function loadAgentSources() {
  const container = document.getElementById('agent-sources-list');
  try {
    const token = localStorage.getItem('opensoul_token') || '';
    const res = await fetch('/api/marketplace/sources?type=agent', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) throw new Error('Failed to load');
    const data = await res.json();
    const sources = data.sources || [];

    if (sources.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">暂无Agent源，点击上方按钮添加</div></div>';
      return;
    }

    container.innerHTML = sources.map(s => `
      <div class="card" data-id="${s.id}">
        <div class="card-header">
          <div>
            <h3 class="card-title">${s.name}</h3>
            <p class="card-desc">${s.description || ''}</p>
          </div>
          <label class="toggle">
            <input type="checkbox" ${s.enabled ? 'checked' : ''} onchange="toggleAgentSrc('${s.id}', this.checked)">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="card-meta">
          <span class="badge ${s.enabled ? 'badge-ok' : 'badge-warn'}">${s.enabled ? '已启用' : '已禁用'}</span>
          <span class="text-muted text-sm">${s.source_type || 'github'}</span>
          ${s.url ? `<a href="${s.url}" target="_blank" class="text-sm text-primary">${s.url.length > 40 ? s.url.substring(0, 40) + '...' : s.url}</a>` : ''}
        </div>
        <div class="card-actions">
          <button class="btn btn-sm" onclick="syncAgentSrc('${s.id}')">🔄 同步</button>
          <button class="btn btn-sm btn-danger" onclick="deleteAgentSrc('${s.id}')">🗑 删除</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠</div><div class="empty-state-text">加载失败: ${e.message}</div></div>`;
  }
}

async function toggleAgentSrc(id, enabled) {
  try {
    const token = localStorage.getItem('opensoul_token') || '';
    await fetch(`/api/marketplace/sources/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ enabled })
    });
    Toast.show(enabled ? '已启用' : '已禁用');
  } catch (e) {
    Toast.show('操作失败', 'error');
  }
}

async function syncAgentSrc(id) {
  try {
    const token = localStorage.getItem('opensoul_token') || '';
    Toast.show('同步中...');
    const res = await fetch(`/api/marketplace/sources/${id}/sync`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    Toast.show(`同步完成: ${data.synced_items || 0} 项`);
  } catch (e) {
    Toast.show('同步失败: ' + e.message, 'error');
  }
}

async function deleteAgentSrc(id) {
  if (!confirm('确定删除此Agent源？')) return;
  try {
    const token = localStorage.getItem('opensoul_token') || '';
    await fetch(`/api/marketplace/sources/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    Toast.show('已删除');
    loadAgentSources();
  } catch (e) {
    Toast.show('删除失败', 'error');
  }
}

async function addAgentSource() {
  const name = prompt('Agent源名称:');
  if (!name) return;
  const url = prompt('源地址 (GitHub URL 或 API 地址):');
  if (!url) return;

  try {
    const token = localStorage.getItem('opensoul_token') || '';
    await fetch('/api/marketplace/sources', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ name, url, source_type: 'custom', item_type: 'agent', enabled: true })
    });
    Toast.show('添加成功');
    loadAgentSources();
  } catch (e) {
    Toast.show('添加失败', 'error');
  }
}

window.init_agent_sources = loadAgentSources;
</script>
