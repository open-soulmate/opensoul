<div class="stats-grid" style="margin-bottom:24px">
    <div class="stat-card">
        <div class="stat-card-header">
            <span class="stat-card-title">在线节点</span>
            <span class="stat-card-icon">◎</span>
        </div>
        <div class="stat-card-value" id="agents-online-count">-</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-header">
            <span class="stat-card-title">总注册数</span>
            <span class="stat-card-icon">◎</span>
        </div>
        <div class="stat-card-value" id="agents-total-count">-</div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span class="card-title">Agent 节点列表</span>
        <button class="btn btn-primary btn-sm" onclick="showRegisterAgent()">+ 注册节点</button>
    </div>
    <div class="card-body">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>名称</th>
                        <th>类型</th>
                        <th>状态</th>
                        <th>最后心跳</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="agents-table-body">
                    <tr>
                        <td colspan="5" style="text-align:center; color:var(--text-muted);">
                            <div class="loading"><div class="spinner"></div>加载中...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 注册Agent对话框 -->
<div id="register-agent-modal" style="display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
    <div class="card" style="width:450px; max-width:90vw;">
        <div class="card-header">
            <span class="card-title">注册 Agent 节点</span>
            <button class="btn btn-sm" onclick="closeRegisterAgent()">✕</button>
        </div>
        <div class="card-body">
            <div class="form-group">
                <label class="form-label">节点名称</label>
                <input class="form-input" id="agent-name" placeholder="如: worker-01">
            </div>
            <div class="form-group">
                <label class="form-label">类型</label>
                <select class="form-select" id="agent-type">
                    <option value="generic">通用</option>
                    <option value="search">搜索</option>
                    <option value="chat">对话</option>
                    <option value="memory">记忆</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">能力 (逗号分隔)</label>
                <input class="form-input" id="agent-capabilities" placeholder="如: rag,search,chat">
            </div>
            <div style="text-align:right; margin-top:16px;">
                <button class="btn" onclick="closeRegisterAgent()" style="margin-right:8px">取消</button>
                <button class="btn btn-primary" onclick="submitAgent()">注册</button>
            </div>
        </div>
    </div>
</div>

<script>
async function init_agents() {
    loadAgentsList();
}

async function loadAgentsList() {
    try {
        const metricsRes = await fetch('/api/vital/metrics');
        const metricsText = await metricsRes.text();
        const metrics = {};
        metricsText.split('\n').forEach(line => {
            const [name, value] = line.trim().split(/\s+/);
            if (name && value) metrics[name] = parseFloat(value);
        });
        document.getElementById('agents-online-count').textContent = Math.round(metrics.vital_agents_online || 0);
    } catch (e) {}

    try {
        const data = await API.get('/agent/');
        const agents = Array.isArray(data) ? data : [];
        document.getElementById('agents-total-count').textContent = agents.length;

        if (agents.length === 0) {
            document.getElementById('agents-table-body').innerHTML =
                '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">暂无注册节点</td></tr>';
            return;
        }

        document.getElementById('agents-table-body').innerHTML = agents.map(agent => {
            const lastSeen = agent.last_seen ? new Date(agent.last_seen) : null;
            const isOnline = lastSeen && (Date.now() - lastSeen.getTime() < 120000);
            return `<tr>
                <td>${escapeHtml(agent.name)}</td>
                <td><span class="badge badge-info">${agent.agent_type || 'generic'}</span></td>
                <td><span class="badge badge-${isOnline ? 'success' : 'warning'}">${isOnline ? '在线' : '离线'}</span></td>
                <td>${lastSeen ? lastSeen.toLocaleString() : '-'}</td>
                <td>
                    <button class="btn btn-sm btn-danger" onclick="deleteAgent('${agent.agent_id}')">删除</button>
                </td>
            </tr>`;
        }).join('');
    } catch (e) {
        document.getElementById('agents-table-body').innerHTML =
            `<tr><td colspan="5" style="text-align:center;color:var(--danger)">加载失败: ${e.message}</td></tr>`;
    }
}

function showRegisterAgent() {
    document.getElementById('register-agent-modal').style.display = 'flex';
}

function closeRegisterAgent() {
    document.getElementById('register-agent-modal').style.display = 'none';
}

async function submitAgent() {
    const name = document.getElementById('agent-name').value.trim();
    const agentType = document.getElementById('agent-type').value;
    const capsRaw = document.getElementById('agent-capabilities').value.trim();

    if (!name) {
        Toast.show('请输入节点名称', 'error');
        return;
    }

    try {
        await API.post('/agent/register', {
            name,
            agent_type: agentType,
            capabilities: capsRaw ? capsRaw.split(',').map(s => s.trim()) : [],
        });
        Toast.show('注册成功');
        closeRegisterAgent();
        loadAgentsList();
    } catch (e) {
        Toast.show(`注册失败: ${e.message}`, 'error');
    }
}

async function deleteAgent(id) {
    if (!confirm('确定删除此节点?')) return;
    Toast.show('删除功能暂未开放', 'warning');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
