    </div>
    <div class="stat-card">
        <div class="stat-card-header">
            <span class="stat-card-title">Agent 在线数</span>
            <span class="stat-card-icon">◎</span>
        </div>
        <div class="stat-card-value" id="stat-agents">-</div>
        <div class="stat-card-sub">当前在线节点</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-header">
            <span class="stat-card-title">系统负载</span>
            <span class="stat-card-icon">⊞</span>
        </div>
        <div class="stat-card-value" id="stat-cpu">-</div>
        <div class="stat-card-sub">CPU 使用率</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-header">

            <span class="stat-card-icon">▣</span>
        </div>
        <div class="stat-card-value" id="stat-memory">-</div>

</div>

<div class="card">
    <div class="card-header">
        <span class="card-title">最近活动</span>
    </div>
    <div class="card-body">
        <ul class="activity-list" id="activity-list">
            <li class="activity-item">
                <span class="activity-dot green"></span>
                <div>
                    <div class="activity-text">系统启动完成</div>
                    <div class="activity-time">刚刚</div>
                </div>
            </li>
            <li class="activity-item">
                <span class="activity-dot blue"></span>
                <div>
                    <div class="activity-text">数据库连接已建立</div>
                    <div class="activity-time">刚刚</div>
                </div>
            </li>
            <li class="activity-item">
                <span class="activity-dot blue"></span>
                <div>
                    <div class="activity-text">Qdrant 向量库就绪</div>
                    <div class="activity-time">刚刚</div>
                </div>
            </li>
            <li class="activity-item">
                <span class="activity-dot blue"></span>
                <div>
                    <div class="activity-text">MeiliSearch 索引就绪</div>
                    <div class="activity-time">刚刚</div>
                </div>
            </li>
        </ul>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span class="card-title">系统组件状态</span>
    </div>
    <div class="card-body">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>组件</th>
                        <th>状态</th>
                        <th>延迟</th>
                        <th>备注</th>
                    </tr>
                </thead>
                <tbody id="health-table-body">
                    <tr>
                        <td colspan="4" style="text-align:center; color:var(--text-muted);">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
async function init_dashboard() {
    loadDashboardStats();
    loadHealthComponents();
    loadRecentAlerts();
}

async function loadHealthComponents() {
    try {
        const health = await API.get('/vital/health');
        const tbody = document.getElementById('health-table-body');
        if (!health.components || health.components.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">无组件数据</td></tr>';
            return;
        }
        tbody.innerHTML = health.components.map(c => {
            const statusClass = c.status === 'healthy' ? 'success' : c.status === 'degraded' ? 'warning' : 'danger';
            return `<tr>
                <td>${c.name}</td>
                <td><span class="badge badge-${statusClass}">${c.status}</span></td>
                <td>${c.latency_ms}ms</td>
                <td>${c.message || '-'}</td>
            </tr>`;
        }).join('');
    } catch (e) {
        console.warn('Health load failed:', e);
    }
}

async function loadRecentAlerts() {
    try {
        const data = await API.get('/vital/alerts');
        if (!data.alerts || data.alerts.length === 0) return;
        const list = document.getElementById('activity-list');
        const recent = data.alerts.slice(0, 5);
        recent.forEach(a => {
            const li = document.createElement('li');
            li.className = 'activity-item';
            const dotClass = a.severity === 'critical' ? 'red' : a.severity === 'warning' ? 'yellow' : 'blue';
            li.innerHTML = `
                <span class="activity-dot ${dotClass}"></span>
                <div>
                    <div class="activity-text">${a.message || a.rule}</div>
                    <div class="activity-time">${a.ts ? new Date(a.ts).toLocaleString() : '-'}</div>
                </div>
            `;
            list.prepend(li);
        });
    } catch (e) {
        // Alerts may not be available yet
    }
}
</script>
