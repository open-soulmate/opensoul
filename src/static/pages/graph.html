<div class="stats-grid" style="margin-bottom:24px">
    <div class="stat-card">
        <div class="stat-card-header">
            <span class="stat-card-title">实体数</span>
            <span class="stat-card-icon">◇</span>
        </div>
        <div class="stat-card-value" id="graph-entities-count">-</div>
    </div>
    <div class="stat-card">
        <div class="stat-card-header">
            <span class="stat-card-title">关系数</span>
            <span class="stat-card-icon">⟷</span>
        </div>
        <div class="stat-card-value" id="graph-relations-count">-</div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span class="card-title">实体列表</span>
    </div>
    <div class="card-body">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>名称</th>
                        <th>类型</th>
                        <th>创建时间</th>
                    </tr>
                </thead>
                <tbody id="graph-entities-body">
                    <tr>
                        <td colspan="3" style="text-align:center; color:var(--text-muted);">
                            <div class="loading"><div class="spinner"></div>加载中...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span class="card-title">关系列表</span>
    </div>
    <div class="card-body">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>源实体</th>
                        <th>关系类型</th>
                        <th>目标实体</th>
                    </tr>
                </thead>
                <tbody id="graph-relations-body">
                    <tr>
                        <td colspan="3" style="text-align:center; color:var(--text-muted);">
                            <div class="loading"><div class="spinner"></div>加载中...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
async function init_graph() {
    let userId = null;
    try {
        const userRes = await API.get('/user/me').catch(() => null);
        if (!userRes) {
            ['graph-entities-body', 'graph-relations-body'].forEach(id => {
                document.getElementById(id).innerHTML =
                    `<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">请先登录</td></tr>`;
            });
            return;
        }
        userId = userRes.id;
    } catch (e) { return; }

    // Load entities
    try {
        const entities = await API.get(`/graph/entities?user_id=${userId}&limit=100`);
        document.getElementById('graph-entities-count').textContent = entities.length;
        if (entities.length === 0) {
            document.getElementById('graph-entities-body').innerHTML =
                '<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">暂无实体</td></tr>';
        } else {
            document.getElementById('graph-entities-body').innerHTML = entities.map(e => `
                <tr>
                    <td>${escapeHtml(e.name || '-')}</td>
                    <td><span class="badge badge-info">${escapeHtml(e.entity_type || '-')}</span></td>
                    <td>${e.created_at ? new Date(e.created_at).toLocaleString() : '-'}</td>
                </tr>
            `).join('');
        }
    } catch (e) {
        document.getElementById('graph-entities-body').innerHTML =
            `<tr><td colspan="3" style="text-align:center;color:var(--danger)">加载失败: ${e.message}</td></tr>`;
    }

    // Load relations
    try {
        const relations = await API.get(`/graph/relations?user_id=${userId}&limit=100`);
        document.getElementById('graph-relations-count').textContent = relations.length;
        if (relations.length === 0) {
            document.getElementById('graph-relations-body').innerHTML =
                '<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">暂无关系</td></tr>';
        } else {
            document.getElementById('graph-relations-body').innerHTML = relations.map(r => `
                <tr>
                    <td>${escapeHtml(r.source_name || r.source_entity_id || '-')}</td>
                    <td><span class="badge badge-success">${escapeHtml(r.relation_type || '-')}</span></td>
                    <td>${escapeHtml(r.target_name || r.target_entity_id || '-')}</td>
                </tr>
            `).join('');
        }
    } catch (e) {
        document.getElementById('graph-relations-body').innerHTML =
            `<tr><td colspan="3" style="text-align:center;color:var(--danger)">加载失败: ${e.message}</td></tr>`;
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
