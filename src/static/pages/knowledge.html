<div class="stats-grid" style="margin-bottom:24px">
    <div class="stat-card">
        <div class="stat-card-header">
            <span class="stat-card-title">总条目数</span>
            <span class="stat-card-icon">◈</span>
        </div>
        <div class="stat-card-value" id="kb-total">-</div>
    </div>
</div>

<!-- 筛选栏 -->
<div class="card" style="margin-bottom:16px">
    <div class="card-body" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap">
        <div style="display:flex; gap:8px; align-items:center; flex:1; min-width:200px">
            <label style="font-size:12px; color:var(--text-muted); white-space:nowrap">领域</label>
            <input class="form-input" id="filter-domain" placeholder="筛选领域..." style="flex:1">
        </div>
        <div style="display:flex; gap:8px; align-items:center; flex:1; min-width:200px">
            <label style="font-size:12px; color:var(--text-muted); white-space:nowrap">标签</label>
            <input class="form-input" id="filter-tag" placeholder="筛选标签..." style="flex:1">
        </div>
        <button class="btn btn-primary btn-sm" onclick="applyFilters()">筛选</button>
        <button class="btn btn-sm" onclick="resetFilters()">重置</button>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span class="card-title">知识库条目</span>
        <button class="btn btn-primary btn-sm" onclick="showAddKnowledge()">+ 新增</button>
    </div>
    <div class="card-body">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>标题</th>
                        <th>类型</th>
                        <th>领域</th>
                        <th>标签</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="knowledge-table-body">
                    <tr>
                        <td colspan="6" style="text-align:center; color:var(--text-muted);">
                            <div class="loading"><div class="spinner"></div>加载中...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <!-- 分页控件 -->
        <div id="pagination-controls" style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding-top:16px; border-top:1px solid var(--border)">
            <div style="font-size:12px; color:var(--text-muted)" id="pagination-info">显示 0 条</div>
            <div style="display:flex; gap:8px">
                <button class="btn btn-sm" id="btn-prev" onclick="prevPage()" disabled>上一页</button>
                <span style="font-size:13px; color:var(--text-secondary); padding:5px 10px" id="page-num">1</span>
                <button class="btn btn-sm" id="btn-next" onclick="nextPage()" disabled>下一页</button>
            </div>
        </div>
    </div>
</div>

<!-- 知识详情对话框 -->
<div id="knowledge-detail-modal" style="display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
    <div class="card" style="width:700px; max-width:90vw; max-height:85vh; overflow-y:auto;">
        <div class="card-header">
            <span class="card-title" id="detail-title">知识详情</span>
            <div style="display:flex; gap:8px">
                <button class="btn btn-primary btn-sm" onclick="editCurrentKnowledge()">编辑</button>
                <button class="btn btn-sm" onclick="closeKnowledgeDetail()">✕</button>
            </div>
        </div>
        <div class="card-body" id="detail-body">
        </div>
    </div>
</div>

<!-- 编辑知识对话框 -->
<div id="edit-knowledge-modal" style="display:none; position:fixed; inset:0; z-index:210; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
    <div class="card" style="width:600px; max-width:90vw; max-height:85vh; overflow-y:auto;">
        <div class="card-header">
            <span class="card-title">编辑知识条目</span>
            <button class="btn btn-sm" onclick="closeEditKnowledge()">✕</button>
        </div>
        <div class="card-body">
            <input type="hidden" id="edit-kb-id">
            <div class="form-group">
                <label class="form-label">标题</label>
                <input class="form-input" id="edit-kb-title" placeholder="知识标题">
            </div>
            <div class="form-group">
                <label class="form-label">内容</label>
                <textarea class="form-textarea" id="edit-kb-content" placeholder="知识内容..." style="min-height:200px"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">类型</label>
                    <select class="form-select" id="edit-kb-type">
                        <option value="text">文本</option>
                        <option value="code">代码</option>
                        <option value="note">笔记</option>
                        <option value="reference">参考</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">领域</label>
                    <input class="form-input" id="edit-kb-domain" placeholder="如: 技术/产品/运营">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">标签 (逗号分隔)</label>
                <input class="form-input" id="edit-kb-tags" placeholder="如: python, fastapi, 教程">
            </div>
            <div style="text-align:right; margin-top:16px;">
                <button class="btn" onclick="closeEditKnowledge()" style="margin-right:8px">取消</button>
                <button class="btn btn-primary" onclick="submitEditKnowledge()">保存修改</button>
            </div>
        </div>
    </div>
</div>

<!-- 新增知识对话框 -->
<div id="add-knowledge-modal" style="display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
    <div class="card" style="width:500px; max-width:90vw; max-height:80vh; overflow-y:auto;">
        <div class="card-header">
            <span class="card-title">新增知识条目</span>
            <button class="btn btn-sm" onclick="closeAddKnowledge()">✕</button>
        </div>
        <div class="card-body">
            <div class="form-group">
                <label class="form-label">标题</label>
                <input class="form-input" id="kb-title" placeholder="知识标题">
            </div>
            <div class="form-group">
                <label class="form-label">内容</label>
                <textarea class="form-textarea" id="kb-content" placeholder="知识内容..." style="min-height:150px"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">类型</label>
                    <select class="form-select" id="kb-type">
                        <option value="text">文本</option>
                        <option value="code">代码</option>
                        <option value="note">笔记</option>
                        <option value="reference">参考</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">领域</label>
                    <input class="form-input" id="kb-domain" placeholder="如: 技术/产品/运营">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">标签 (逗号分隔)</label>
                <input class="form-input" id="kb-tags" placeholder="如: python, fastapi, 教程">
            </div>
            <div style="text-align:right; margin-top:16px;">
                <button class="btn" onclick="closeAddKnowledge()" style="margin-right:8px">取消</button>
                <button class="btn btn-primary" onclick="submitKnowledge()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- Styles moved to main style.css -->

<script>
let _kbUserId = null;
let _currentPage = 0;
const _pageSize = 20;
let _currentFilter = { domain: null, tag: null };
let _currentDetailId = null;

async function init_knowledge() {
    try {
        const userRes = await API.get('/user/me').catch(() => null);
        if (userRes) _kbUserId = userRes.id;
    } catch (e) {}
    loadKnowledgeList();
}

function applyFilters() {
    const domain = document.getElementById('filter-domain').value.trim();
    const tag = document.getElementById('filter-tag').value.trim();
    _currentFilter.domain = domain || null;
    _currentFilter.tag = tag || null;
    _currentPage = 0;
    loadKnowledgeList();
}

function resetFilters() {
    document.getElementById('filter-domain').value = '';
    document.getElementById('filter-tag').value = '';
    _currentFilter.domain = null;
    _currentFilter.tag = null;
    _currentPage = 0;
    loadKnowledgeList();
}

function prevPage() {
    if (_currentPage > 0) {
        _currentPage--;
        loadKnowledgeList();
    }
}

function nextPage() {
    _currentPage++;
    loadKnowledgeList();
}

async function loadKnowledgeList() {
    try {
        if (!_kbUserId) {
            const userRes = await API.get('/user/me').catch(() => null);
            if (!userRes) {
                document.getElementById('knowledge-table-body').innerHTML =
                    '<tr><td colspan="6" style="text-align:center;color:var(--text-muted)">请先登录</td></tr>';
                return;
            }
            _kbUserId = userRes.id;
        }

        const offset = _currentPage * _pageSize;
        let url = `/knowledge/?user_id=${_kbUserId}&offset=${offset}&limit=${_pageSize}`;
        if (_currentFilter.domain) url += `&domain=${encodeURIComponent(_currentFilter.domain)}`;
        if (_currentFilter.tag) url += `&tag=${encodeURIComponent(_currentFilter.tag)}`;

        const items = await API.get(url);
        document.getElementById('kb-total').textContent = items.length + offset;

        // 更新分页控件
        const hasMore = items.length >= _pageSize;
        document.getElementById('btn-prev').disabled = _currentPage === 0;
        document.getElementById('btn-next').disabled = !hasMore;
        document.getElementById('page-num').textContent = _currentPage + 1;
        document.getElementById('pagination-info').textContent =
            `显示 ${offset + 1}-${offset + items.length} 条`;

        if (items.length === 0 && _currentPage === 0) {
            document.getElementById('knowledge-table-body').innerHTML =
                '<tr><td colspan="6" style="text-align:center;color:var(--text-muted)">暂无数据</td></tr>';
            return;
        }

        if (items.length === 0) {
            _currentPage--;
            loadKnowledgeList();
            return;
        }

        document.getElementById('knowledge-table-body').innerHTML = items.map(item => {
            const tags = (item.tags || []).map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('');
            return `<tr class="kb-row" onclick="showKnowledgeDetail('${item.id}')">
                <td>${escapeHtml(item.title || '(无标题)')}</td>
                <td><span class="badge badge-info">${item.content_type || '-'}</span></td>
                <td>${escapeHtml(item.domain || '-')}</td>
                <td><div class="tag-list">${tags || '<span style="color:var(--text-muted)">-</span>'}</div></td>
                <td>${item.created_at ? new Date(item.created_at).toLocaleString() : '-'}</td>
                <td onclick="event.stopPropagation()">
                    <button class="btn btn-sm" onclick="showKnowledgeDetail('${item.id}')">详情</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteKnowledge('${item.id}')">删除</button>
                </td>
            </tr>`;
        }).join('');
    } catch (e) {
        document.getElementById('knowledge-table-body').innerHTML =
            `<tr><td colspan="6" style="text-align:center;color:var(--danger)">加载失败: ${e.message}</td></tr>`;
    }
}

function renderMarkdown(text) {
    if (!text) return '<p style="color:var(--text-muted)">(无内容)</p>';

    let html = escapeHtml(text);

    // Code blocks
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Headers
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    // Bold
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    // Italic
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    // Blockquotes
    html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
    // Unordered lists
    html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
    // Ordered lists
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    // Horizontal rules
    html = html.replace(/^---$/gm, '<hr>');
    // Links
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    // Line breaks
    html = html.replace(/\n\n/g, '</p><p>');
    html = html.replace(/\n/g, '<br>');

    return `<div class="markdown-body"><p>${html}</p></div>`;
}

async function showKnowledgeDetail(id) {
    const modal = document.getElementById('knowledge-detail-modal');
    const body = document.getElementById('detail-body');
    const title = document.getElementById('detail-title');

    _currentDetailId = id;
    body.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
    modal.style.display = 'flex';

    try {
        const item = await API.get(`/knowledge/${id}?user_id=${_kbUserId}`);
        title.textContent = item.title || '知识详情';

        const tags = (item.tags || []).map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('');
        const meta = item.metadata || {};
        const entities = meta.entities || [];
        const entityChips = entities.map(e => `<span class="entity-chip">${escapeHtml(typeof e === 'string' ? e : e.name || JSON.stringify(e))}</span>`).join('');

        // 检查关联关系
        const relations = meta.relations || [];
        const relationHtml = relations.length > 0 ? `
            <div class="detail-section">
                <div class="detail-label">关联关系</div>
                <div class="tag-list">${relations.map(r => `<span class="entity-chip">${escapeHtml(typeof r === 'string' ? r : JSON.stringify(r))}</span>`).join('')}</div>
            </div>
        ` : '';

        body.innerHTML = `
            <div class="detail-meta">
                <div class="detail-meta-item">
                    <div class="detail-meta-label">类型</div>
                    <div class="detail-meta-value"><span class="badge badge-info">${item.content_type || 'text'}</span></div>
                </div>
                <div class="detail-meta-item">
                    <div class="detail-meta-label">领域</div>
                    <div class="detail-meta-value">${escapeHtml(item.domain || '-')}</div>
                </div>
                <div class="detail-meta-item">
                    <div class="detail-meta-label">来源</div>
                    <div class="detail-meta-value">${escapeHtml(item.source || '-')}</div>
                </div>
                <div class="detail-meta-item">
                    <div class="detail-meta-label">创建时间</div>
                    <div class="detail-meta-value">${item.created_at ? new Date(item.created_at).toLocaleString() : '-'}</div>
                </div>
                <div class="detail-meta-item">
                    <div class="detail-meta-label">更新时间</div>
                    <div class="detail-meta-value">${item.updated_at ? new Date(item.updated_at).toLocaleString() : '-'}</div>
                </div>
            </div>

            <div class="detail-section">
                <div class="detail-label">标签</div>
                <div class="tag-list">${tags || '<span style="color:var(--text-muted)">无标签</span>'}</div>
            </div>

            ${entityChips ? `<div class="detail-section">
                <div class="detail-label">关联实体</div>
                <div class="tag-list">${entityChips}</div>
            </div>` : ''}

            ${relationHtml}

            <div class="detail-section">
                <div class="detail-label">完整内容</div>
                <div class="detail-content">${renderMarkdown(item.content)}</div>
            </div>

            ${item.embedding_id ? `<div class="detail-section">
                <div class="detail-label">向量 ID</div>
                <div class="detail-value" style="font-size:12px;color:var(--text-muted);font-family:monospace">${item.embedding_id}</div>
            </div>` : ''}
        `;
    } catch (e) {
        body.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠</div><div class="empty-state-text">加载失败: ${e.message}</div></div>`;
    }
}

function closeKnowledgeDetail() {
    document.getElementById('knowledge-detail-modal').style.display = 'none';
    _currentDetailId = null;
}

function editCurrentKnowledge() {
    if (!_currentDetailId) return;
    closeKnowledgeDetail();
    showEditKnowledge(_currentDetailId);
}

async function showEditKnowledge(id) {
    const modal = document.getElementById('edit-knowledge-modal');
    modal.style.display = 'flex';

    try {
        const item = await API.get(`/knowledge/${id}?user_id=${_kbUserId}`);
        document.getElementById('edit-kb-id').value = id;
        document.getElementById('edit-kb-title').value = item.title || '';
        document.getElementById('edit-kb-content').value = item.content || '';
        document.getElementById('edit-kb-type').value = item.content_type || 'text';
        document.getElementById('edit-kb-domain').value = item.domain || '';
        document.getElementById('edit-kb-tags').value = (item.tags || []).join(', ');
    } catch (e) {
        Toast.show(`加载失败: ${e.message}`, 'error');
        closeEditKnowledge();
    }
}

function closeEditKnowledge() {
    document.getElementById('edit-knowledge-modal').style.display = 'none';
}

async function submitEditKnowledge() {
    const id = document.getElementById('edit-kb-id').value;
    const title = document.getElementById('edit-kb-title').value.trim();
    const content = document.getElementById('edit-kb-content').value.trim();
    const contentType = document.getElementById('edit-kb-type').value;
    const domain = document.getElementById('edit-kb-domain').value.trim();
    const tagsRaw = document.getElementById('edit-kb-tags').value.trim();

    if (!title || !content) {
        Toast.show('标题和内容不能为空', 'error');
        return;
    }

    try {
        await API.put(`/knowledge/${id}?user_id=${_kbUserId}`, {
            title,
            content,
            content_type: contentType,
            domain: domain || null,
            tags: tagsRaw ? tagsRaw.split(',').map(s => s.trim()).filter(Boolean) : [],
        });
        Toast.show('修改成功');
        closeEditKnowledge();
        loadKnowledgeList();
    } catch (e) {
        Toast.show(`修改失败: ${e.message}`, 'error');
    }
}

function showAddKnowledge() {
    document.getElementById('add-knowledge-modal').style.display = 'flex';
}

function closeAddKnowledge() {
    document.getElementById('add-knowledge-modal').style.display = 'none';
}

async function submitKnowledge() {
    const title = document.getElementById('kb-title').value.trim();
    const content = document.getElementById('kb-content').value.trim();
    const contentType = document.getElementById('kb-type').value;
    const domain = document.getElementById('kb-domain').value.trim();
    const tagsRaw = document.getElementById('kb-tags').value.trim();

    if (!title || !content) {
        Toast.show('标题和内容不能为空', 'error');
        return;
    }

    try {
        if (!_kbUserId) {
            const userRes = await API.get('/user/me').catch(() => null);
            if (!userRes) { Toast.show('请先登录', 'error'); return; }
            _kbUserId = userRes.id;
        }

        await API.post(`/knowledge/?user_id=${_kbUserId}`, {
            title,
            content,
            content_type: contentType,
            domain: domain || null,
            tags: tagsRaw ? tagsRaw.split(',').map(s => s.trim()).filter(Boolean) : [],
        });
        Toast.show('添加成功');
        closeAddKnowledge();
        // Clear form
        document.getElementById('kb-title').value = '';
        document.getElementById('kb-content').value = '';
        document.getElementById('kb-domain').value = '';
        document.getElementById('kb-tags').value = '';
        loadKnowledgeList();
    } catch (e) {
        Toast.show(`添加失败: ${e.message}`, 'error');
    }
}

async function deleteKnowledge(id) {
    if (!confirm('确定删除此条目?')) return;
    try {
        if (!_kbUserId) {
            const userRes = await API.get('/user/me').catch(() => null);
            if (!userRes) return;
            _kbUserId = userRes.id;
        }
        await API.del(`/knowledge/${id}?user_id=${_kbUserId}`);
        Toast.show('已删除');
        loadKnowledgeList();
    } catch (e) {
        Toast.show(`删除失败: ${e.message}`, 'error');
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
