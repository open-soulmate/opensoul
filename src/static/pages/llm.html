<div class="card">
    <div class="card-header">
        <span class="card-title">LLM 配置</span>
    </div>
    <div class="card-body">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">默认模型</label>
                <input class="form-input" id="llm-model" placeholder="如: gpt-4o">
            </div>
            <div class="form-group">
                <label class="form-label">API Base URL</label>
                <input class="form-input" id="llm-base-url" placeholder="如: https://api.openai.com/v1">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Temperature</label>
                <input class="form-input" id="llm-temperature" type="number" step="0.1" min="0" max="2" value="0.7">
            </div>
            <div class="form-group">
                <label class="form-label">Max Tokens</label>
                <input class="form-input" id="llm-max-tokens" type="number" min="1" value="4096">
            </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn btn-primary" onclick="saveLLMConfig()">保存配置</button>
            <button class="btn" onclick="testLLMConn()">测试连接</button>
        </div>
        <div id="llm-test-result" style="margin-top:12px;font-size:13px;display:none"></div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span class="card-title">Provider 列表</span>
    </div>
    <div class="card-body">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Provider</th>
                        <th>模型</th>
                        <th>优先级</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="llm-providers-body">
                    <tr>
                        <td colspan="4" style="text-align:center;color:var(--text-muted)">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span class="card-title">已配置的模型</span>
    </div>
    <div class="card-body">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>模型名称</th>
                        <th>提供商</th>
                        <th>类型</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="llm-models-body">
                    <tr>
                        <td colspan="4" style="text-align:center;color:var(--text-muted)">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
async function init_llm() {
    // Load current config
    try {
        const config = await API.get('/llm/config');
        if (config.model) document.getElementById('llm-model').value = config.model;
        if (config.base_url) document.getElementById('llm-base-url').value = config.base_url;
    } catch (e) {}

    // Load providers from Gland
    try {
        const data = await API.get('/gland/providers');
        const providers = data.providers || [];
        if (providers.length === 0) {
            document.getElementById('llm-providers-body').innerHTML =
                '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">暂无 Provider</td></tr>';
        } else {
            document.getElementById('llm-providers-body').innerHTML = providers.map(p => {
                const models = p.models ? Object.entries(p.models).map(([k, v]) => `${k}: ${v}`).join(', ') : '-';
                const sc = p.enabled !== false ? 'success' : 'warning';
                return `<tr>
                    <td>${escapeHtml(p.name)}</td>
                    <td style="font-size:12px">${escapeHtml(models)}</td>
                    <td>${p.priority ?? '-'}</td>
                    <td><span class="badge badge-${sc}">${p.enabled !== false ? '启用' : '禁用'}</span></td>
                </tr>`;
            }).join('');
        }
    } catch (e) {
        document.getElementById('llm-providers-body').innerHTML =
            '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">无法加载</td></tr>';
    }

    // Load models from Gland
    try {
        const data = await API.get('/gland/models');
        const providers = data.providers || {};
        const rows = [];
        for (const [name, p] of Object.entries(providers)) {
            const models = p.models || {};
            for (const [task, model] of Object.entries(models)) {
                rows.push({ provider: name, model, task, enabled: p.enabled !== false });
            }
        }
        if (rows.length === 0) {
            document.getElementById('llm-models-body').innerHTML =
                '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">暂无模型配置</td></tr>';
        } else {
            document.getElementById('llm-models-body').innerHTML = rows.map(r => `
                <tr>
                    <td>${escapeHtml(r.model)}</td>
                    <td>${escapeHtml(r.provider)}</td>
                    <td><span class="badge badge-info">${r.task}</span></td>
                    <td><span class="badge badge-${r.enabled ? 'success' : 'warning'}">${r.enabled ? '可用' : '禁用'}</span></td>
                </tr>
            `).join('');
        }
    } catch (e) {
        document.getElementById('llm-models-body').innerHTML =
            '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">暂无模型配置</td></tr>';
    }
}

async function saveLLMConfig() {
    const model = document.getElementById('llm-model').value.trim();
    const baseUrl = document.getElementById('llm-base-url').value.trim();

    try {
        const body = {};
        if (model) body.model = model;
        if (baseUrl) body.base_url = baseUrl;
        await API.post('/llm/config', body);
        Toast.show('LLM 配置已保存');
    } catch (e) {
        Toast.show(`保存失败: ${e.message}`, 'error');
    }
}

async function testLLMConn() {
    const resultEl = document.getElementById('llm-test-result');
    resultEl.style.display = 'block';
    resultEl.style.color = 'var(--text-muted)';
    resultEl.textContent = '测试连接中...';

    try {
        const result = await API.post('/llm/test', {});
        resultEl.style.color = 'var(--success)';
        resultEl.textContent = `连接成功 - 模型: ${result.model}, 回复: ${result.reply}`;
    } catch (e) {
        resultEl.style.color = 'var(--danger)';
        resultEl.textContent = `连接失败: ${e.message}`;
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
