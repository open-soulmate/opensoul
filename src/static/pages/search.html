<div class="card" style="margin-bottom:24px">
    <div class="card-header">
        <span class="card-title">知识搜索</span>
    </div>
    <div class="card-body">
        <div style="display:flex; gap:12px; align-items:flex-end;">
            <div class="form-group" style="flex:1; margin-bottom:0;">
                <label class="form-label">搜索关键词</label>
                <input class="form-input" id="search-query" placeholder="输入搜索内容..." onkeydown="if(event.key==='Enter')doSearch()">
            </div>
            <div class="form-group" style="width:140px; margin-bottom:0;">
                <label class="form-label">搜索模式</label>
                <select class="form-select" id="search-mode">
                    <option value="hybrid">混合搜索</option>
                    <option value="semantic">语义搜索</option>
                    <option value="fulltext">全文搜索</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="doSearch()">搜索</button>
        </div>
    </div>
</div>

<div id="search-results-container" style="display:none">
    <div class="card">
        <div class="card-header">
            <span class="card-title" id="search-results-title">搜索结果</span>
        </div>
        <div class="card-body">
            <div id="search-results"></div>
        </div>
    </div>
</div>

<!-- Styles moved to main style.css -->

<script>
async function init_search() {
    document.getElementById('search-query').focus();
}

async function doSearch() {
    const query = document.getElementById('search-query').value.trim();
    const mode = document.getElementById('search-mode').value;
    const container = document.getElementById('search-results-container');
    const resultsDiv = document.getElementById('search-results');
    const titleEl = document.getElementById('search-results-title');

    if (!query) {
        Toast.show('请输入搜索内容', 'warning');
        return;
    }

    let userId = null;
    try {
        const userRes = await API.get('/user/me').catch(() => null);
        if (!userRes) {
            Toast.show('请先登录', 'error');
            return;
        }
        userId = userRes.id;
    } catch (e) { return; }

    container.style.display = 'block';
    resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div>搜索中...</div>';
    titleEl.textContent = '搜索中...';

    try {
        const data = await API.get(`/search/?q=${encodeURIComponent(query)}&user_id=${userId}&mode=${mode}&limit=20`);
        const results = data.results || [];

        titleEl.textContent = `搜索结果 (${results.length} 条)`;

        if (results.length === 0) {
            resultsDiv.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⌕</div><div class="empty-state-text">未找到匹配结果</div></div>';
            return;
        }

        resultsDiv.innerHTML = results.map(r => {
            const content = r.content || r.text || '';
            const snippet = content.length > 200 ? content.slice(0, 200) + '...' : content;
            return `<div class="search-result-item" onclick="showSearchDetail(${escapeJson(JSON.stringify(r))})">
                <div class="search-result-title">${escapeHtml(r.title || '(无标题)')}</div>
                <div class="search-result-snippet">${escapeHtml(snippet)}</div>
                <div class="search-result-meta">
                    ${r.score !== undefined ? `<span class="search-score">相关度: ${(r.score * 100).toFixed(1)}%</span>` : ''}
                    ${r.content_type ? `<span>类型: ${r.content_type}</span>` : ''}
                    ${r.domain ? `<span>领域: ${r.domain}</span>` : ''}
                </div>
            </div>`;
        }).join('');
    } catch (e) {
        resultsDiv.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠</div><div class="empty-state-text">搜索失败: ${e.message}</div></div>`;
        titleEl.textContent = '搜索失败';
    }
}

function showSearchDetail(item) {
    // Reuse knowledge detail modal if available
    if (item.id) {
        showKnowledgeDetail(item.id);
    }
}

function escapeJson(str) {
    return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
